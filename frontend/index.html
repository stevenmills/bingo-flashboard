<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="/paw.svg" />
    <title>Bingo Flashboard</title>
  </head>
  <body>
    <script>
      // Apply theme before paint to avoid flash. Card/HUD default to dark.
      (function () {
        var mode = sessionStorage.getItem('bingo-app-mode');
        var theme;
        if (mode === 'card') {
          theme = localStorage.getItem('bingo-theme-card') || 'dark';
        } else if (mode === 'hud') {
          theme = localStorage.getItem('bingo-theme-hud') || 'dark';
        } else if (mode === 'board' || mode === 'scan') {
          theme = localStorage.getItem('bingo-theme-board') || localStorage.getItem('bingo-theme') || 'light';
        } else {
          theme = localStorage.getItem('bingo-theme') || 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
