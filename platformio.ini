; Bingo Flashboard – AITRIP 30-pin CP2102 ESP-WROOM-32 USB-C (Amazon B0CR5Y2JVD)
; Wiring / pinout: WIRING.md
[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.0.17 / IDF 4.4 — RMT4 FastLED path (avoids RMT5 breakage).
platform = espressif32 @ 6.12.0
board = esp32dev
; esp32dev matches AITRIP 30-pin ESP-WROOM-32 (4 MB flash, CP2102)
framework = arduino
monitor_speed = 115200
; Keep the Arduino core from claiming an RMT channel for a builtin RGB LED.
build_flags =
    -DESP32_ARDUINO_NO_RGB_BUILTIN
    -URGB_BUILTIN
lib_deps =
    ; 3.7.8 = last solid RMT4 release before RMT5/I2S churn.
    fastled/FastLED@3.7.8
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^6.21.3
board_build.filesystem = spiffs
; Larger SPIFFS for web UI + caller MP3 clips (single app slot, no OTA).
board_build.partitions = partitions/bingo.csv
extra_scripts = pre:scripts/pio_gen_game_types.py
