; Bingo Flashboard – ESP32-S3-WROOM-1 N16R8 (44-pin DevKitC-1 layout, dual USB-C)
; Wiring / pinout: WIRING.md
[platformio]
default_envs = esp32s3

[env:esp32s3]
; Arduino-ESP32 2.0.17 / IDF 4.4 — RMT4 FastLED path (avoids RMT5 breakage on S3).
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
; N16R8: 16 MB octal flash + 8 MB octal PSRAM.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
; USB Serial/JTAG on S3 often ignores classic UART limits; still set high for UART adapters.
upload_speed = 2000000
board_upload.speed = 2000000
; Keep the Arduino core from claiming an RMT channel for the onboard RGB (GPIO48/38).
; Hardware CDC/JTAG (usb_mode=1) + CDC on boot so Serial works on the only USB
; port these boards usually enumerate (VID 303A:1001). The other USB-C often has
; no UART bridge chip, so pio device list goes empty if you switch cables.
board_build.cdc_on_boot = 1
board_build.usb_mode = 1
build_flags =
    -DESP32_ARDUINO_NO_RGB_BUILTIN
    -URGB_BUILTIN
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Capture panic PC/reason into RTC_NOINIT via wrapped handler (see src/crash_log.cpp).
    -Wl,--wrap=esp_panic_handler
lib_deps =
    ; 3.7.8 = last solid RMT4 release before RMT5/I2S churn.
    fastled/FastLED@3.7.8
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
board_build.filesystem = spiffs
board_build.partitions = partitions/bingo.csv
extra_scripts = pre:scripts/pio_gen_game_types.py
