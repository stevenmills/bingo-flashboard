; Bingo Flashboard – AITRIP 30-pin CP2102 ESP-WROOM-32 USB-C (Amazon B0CR5Y2JVD)
; Wiring / pinout: WIRING.md
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
; esp32dev matches AITRIP 30-pin ESP-WROOM-32 (4 MB flash, CP2102)
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.6.0
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^6.21.3
board_build.filesystem = spiffs
; Larger SPIFFS for web UI + caller MP3 clips (single app slot, no OTA).
board_build.partitions = partitions/bingo.csv
